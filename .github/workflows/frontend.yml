name: Frontend checkpoint
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5.6.0
        with:
          python-version-file: .python-version
      - name: Install the local service for real-mode tests
        working-directory: backend
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --require-hashes -r requirements.lock
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx --no-install playwright install chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: phase-1-windows-evidence
          path: |
            artifacts/phase-1-acceptance/
            artifacts/phase-2-checkpoint-1/
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
